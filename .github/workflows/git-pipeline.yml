name: MuleSoft CH2.0 Deployment main pipeline

on:
  workflow_dispatch: #  Allowing manual branch execution

env:
  APP_VERSION: '1.0.${{ github.run_number }}'   # unique GAV per run
                                                # (pom version = ${revision})
                                                
jobs:
  CI:
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
          
      - name: Set up JDK 17 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test Phase
        if: github.ref == 'refs/heads/develop'
        run:  mvn clean test -s .maven/settings.xml -Drevision=$APP_VERSION -Dmule.env=${{ vars.MULE_ENV_DEV }} 

      - name: Package Phase
        run:  mvn clean package -DskipTests -s .maven/settings.xml -Drevision=$APP_VERSION

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(ls target/*.jar | head -1 | sed "s/.jar/-$commitHash.jar/g")
          mv $artifactName1 $artifactName2

      - name: Normalize artifact name
        run: mv "$(ls target/*.jar | head -1)" target/app.jar

      - name: Publish to Exchange
        run: |

          mvn deploy \
          -DskipTests \
          -s .maven/settings.xml \
          -Drevision=$APP_VERSION \
          -Dmule.artifact=target/app.jar 

      - name: Publish Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            pom.xml
            .maven/
            target/app.jar
          include-hidden-files: true

  Deploy_To_Dev:
    needs: CI
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: DEV
    secrets: inherit

  Deploy_To_QA:
    needs: CI
    if: github.ref == 'refs/heads/qa'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: QA
    secrets: inherit

  Deploy_To_UAT:
    needs: CI
    if: github.ref == 'refs/heads/uat'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: UAT
    secrets: inherit

  # PROD gate lives on the Environment: Settings → Environments → PROD
  # → Required reviewers (+ restrict deployment branches to main).
  Deploy_To_PROD:
    needs: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: PROD
    secrets: inherit
  
